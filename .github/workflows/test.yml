name: Test

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Verify dist/ is committed and up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/index.js is out of date — run 'npm run build' and commit the result"
            exit 1
          fi

  smoke-test:
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v7
      - name: Install a real released version and check it runs
        uses: ./
        with:
          version: latest
          token: ${{ secrets.FINOPSLY_INTERNAL_TOKEN }}
      - run: finopsly version
