name: Test

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Verify dist/ is committed and up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/index.js is out of date — run 'npm run build' and commit the result"
            exit 1
          fi

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install a real released version and check it runs
        uses: ./
        with:
          version: latest
          token: ${{ secrets.FINOPSLY_INTERNAL_TOKEN }}
      - run: finopsly version
