name: Test

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Verify dist/ is committed and up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/index.js is out of date — run 'npm run build' and commit the result"
            exit 1
          fi

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # finopsly-pulse-cli (the action's default repo) has no releases yet —
      # nothing has shipped there. finopsly-pulse-cli-internal is the only repo
      # with real releases to actually install and smoke-test against right now.
      # Switch this back to the default once finopsly-pulse-cli has a real release.
      # run-estimate: false — this job has no live FinOpsly backend
      # credentials to give it; it's only exercising the install mechanics.
      # The real estimate/sarif/post-comment path is exercised end-to-end by
      # finopsly-pulse-testing's own workflow, which does have real credentials.
      - name: Install a real released version and check it runs
        uses: ./
        with:
          version: latest
          repo: finopsly-pulse-cli-internal
          token: ${{ secrets.FINOPSLY_INTERNAL_TOKEN }}
          run-estimate: false
      - run: finopsly version

      - name: Set up a scratch Terraform dir for the workspace input
        run: |
          mkdir -p /tmp/workspace-smoke-test
          cat > /tmp/workspace-smoke-test/main.tf << 'EOF'
          terraform {
            required_providers {
              aws = { source = "hashicorp/aws", version = "~> 6.0" }
            }
          }
          EOF
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: terraform init (workspace select requires this for remote backends)
        working-directory: /tmp/workspace-smoke-test
        run: terraform init -input=false

      - name: Select (and create) a workspace via the action's workspace input
        uses: ./
        with:
          version: latest
          repo: finopsly-pulse-cli-internal
          token: ${{ secrets.FINOPSLY_INTERNAL_TOKEN }}
          workspace: ci-smoke-test
          working-directory: /tmp/workspace-smoke-test
          run-estimate: false
      - name: Verify the workspace was actually selected
        working-directory: /tmp/workspace-smoke-test
        run: |
          selected="$(terraform workspace show)"
          if [ "$selected" != "ci-smoke-test" ]; then
            echo "::error::expected workspace 'ci-smoke-test', got '$selected'"
            exit 1
          fi
          echo "workspace input correctly selected: $selected"
