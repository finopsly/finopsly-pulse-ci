name: Release

# dist/ is committed as part of normal development (test.yml enforces this on
# every push/PR). This workflow's only job on a version tag push is to move
# the floating major-version tag (e.g. v1) to point at it — the standard
# convention for GitHub Actions, so customers can pin `uses: .../finopsly-ci@v1`
# and automatically get non-breaking updates.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Move floating major tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR="v$(echo "$TAG" | sed -E 's/^v([0-9]+)\..*/\1/')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force
